{% set name = "rattler-build" %}
{% set version = "0.76.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/prefix-dev/rattler-build/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2caad9c21e3293b04ff007f883ab42f465c8e619b230baffcd2a9d88a0979071

build:
  number: 0
  # cargo produces a rust binary; C++ compiler is build-only (aws-lc-sys cmake).
  # overdepending: libstdcxx / libcxx / vc14_runtime never appear in NEEDED.
  ignore_run_exports_from:
    - {{ compiler('cxx') }}
  ignore_run_exports:
    - ucrt  # [win]

requirements:
  build:
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - {{ compiler('cxx') }}
    # aws-lc-sys (sigstore/s3) needs a C/C++ cmake build, not only rustc
    - cmake
    - make  # [unix]
  host:
    # CBC pin so native-tls links the same openssl pkgs/main ships, not "any"
    - openssl {{ openssl }}  # [linux]
  run:
    - patchelf  # [linux]

test:
  files:
    - test-recipe
  commands:
    - rattler-build --help
    - test ! -f ${PREFIX}/bin/generate-cli-docs  # [unix]
    - test -f $PREFIX/share/zsh/site-functions/_rattler-build  # [unix]
    - test -f $PREFIX/share/bash-completion/completions/rattler-build  # [unix]
    - test -f $PREFIX/share/fish/vendor_completions.d/rattler-build.fish  # [unix]
    # 0.55.1 already ran this; it is the only test that rattler-build can
    # download a remote source. conda-forge dropped it; we keep it because
    # the slepc tarball still returns HTTP 200 and PBP workers can fetch.
    - rattler-build build --recipe ./test-recipe/check.yaml  # [unix]
    - rattler-build build --recipe ./test-recipe/check.yaml --output-dir %PREFIX%/out  # [win]

about:
  home: https://github.com/prefix-dev/rattler-build
  dev_url: https://github.com/prefix-dev/rattler-build
  doc_url: https://rattler.build
  summary: rattler-build is the universal conda package builder for Windows, macOS and Linux
  description: |
    The rattler-build tooling and library creates cross-platform relocatable binaries / packages
    from a simple recipe format.
    The recipe format is heavily inspired by conda-build and boa, and the output of a regular
    rattler-build run is a package that can be installed using mamba, conda or rattler.
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    - CONDA_BUILD_LICENSE.txt
  license_family: BSD
